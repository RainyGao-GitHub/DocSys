<div class="form-horizontal">
  <!-- Name -->
  <div class="form-group">
    <label class="control-label col-lg-3" for="name">Name</label>
    <div class="col-lg-9">
      <input type="text" class="form-control" id="systemSettingName" name="systemSettingName">
      <span class="help-block" id="systemSettingNameHelp">Dotted namespace, e.g. sms.provider; letters, digits, dot(.), underscore(_), hyphen(-) only; <b>the key cannot be renamed after creation</b></span>
    </div>
  </div>
  <!-- Value -->
  <div class="form-group">
    <label class="control-label col-lg-3" for="value">Value</label>
    <div class="col-lg-9">
      <textarea class="form-control" id="systemSettingValue" name="systemSettingValue" rows="8"></textarea>
      <span class="help-block">Plain string is fine; JSON-typed settings (e.g. sms.scenes / sms.yunpian) must be a valid JSON object</span>
    </div>
  </div>
  <!-- Remark -->
  <div class="form-group">
    <label class="control-label col-lg-3" for="remark">Remark</label>
    <div class="col-lg-9">
      <textarea class="form-control" id="systemSettingRemark" name="systemSettingRemark" rows="3"></textarea>
      <span class="help-block">Purpose / source of this setting (max 1024 characters)</span>
    </div>
  </div>

  <!-- Buttons -->
  <div class="form-group">
    <div class="col-lg-offset-9 col-lg-2">
      <button type="submit" class="btn btn-success" id="btn_saveSystemSetting" onclick="saveSystemSetting()">Save</button>
    </div>
  </div>
</div>
<script type="text/javascript" src="systemSettingEdit.js"></script>
