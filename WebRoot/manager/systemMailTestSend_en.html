<div class="form-horizontal">
  <div class="form-group">
    <label class="control-label col-lg-3" for="systemMailTestToEmail">Recipient</label>
    <div class="col-lg-9">
      <input type="text" class="form-control" id="systemMailTestToEmail" name="systemMailTestToEmail" maxlength="100" placeholder="Email address that receives the test message">
      <span class="help-block">Sends one message with the subject "MxsDoc Mail Service Test" right away.</span>
    </div>
  </div>

  <div class="form-group">
    <div class="col-lg-offset-3 col-lg-9">
      <button type="button" class="btn btn-warning" id="btnSendSystemMailTest" onclick="sendSystemMailTest()">Send</button>
      <span class="help-block" id="systemMailTestHint">While editing, the values on the page are used; in read-only mode the saved configuration is used.</span>
    </div>
  </div>

  <div class="form-group">
    <div class="col-lg-12" id="systemMailTestResult"></div>
  </div>
</div>
<script type="text/javascript" src="systemMailTestSend.js"></script>
