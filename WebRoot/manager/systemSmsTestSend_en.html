<div class="form-horizontal">
  <div class="form-group">
    <label class="control-label col-lg-3" for="systemSmsTestPhone">Mobile</label>
    <div class="col-lg-9">
      <input type="text" class="form-control" id="systemSmsTestPhone" name="systemSmsTestPhone" maxlength="20" placeholder="Mobile number to receive the test SMS">
      <span class="help-block">The "test" scene template is used; the template variable code is a random verification code.</span>
    </div>
  </div>

  <div class="form-group">
    <div class="col-lg-offset-3 col-lg-9">
      <button type="button" class="btn btn-warning" id="btnSendSystemSmsTest" onclick="sendSystemSmsTest()">Send</button>
      <span class="help-block" id="systemSmsTestHint">While editing the current form values are used; in read-only mode the saved configuration is used.</span>
    </div>
  </div>

  <div class="form-group">
    <div class="col-lg-12" id="systemSmsTestResult"></div>
  </div>
</div>
<script type="text/javascript" src="systemSmsTestSend.js"></script>
