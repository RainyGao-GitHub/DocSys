<div class="form-horizontal">
  <div class="form-group">
    <label class="control-label col-lg-3" for="systemMailTestToEmail">收件邮箱</label>
    <div class="col-lg-9">
      <input type="text" class="form-control" id="systemMailTestToEmail" name="systemMailTestToEmail" maxlength="100" placeholder="接收测试邮件的邮箱地址">
      <span class="help-block">会立即发送一封主题为「MxsDoc 邮件服务测试」的邮件。</span>
    </div>
  </div>

  <div class="form-group">
    <div class="col-lg-offset-3 col-lg-9">
      <button type="button" class="btn btn-warning" id="btnSendSystemMailTest" onclick="sendSystemMailTest()">发送</button>
      <span class="help-block" id="systemMailTestHint">编辑状态下用页面当前值发送；只读状态下用已保存的配置发送。</span>
    </div>
  </div>

  <div class="form-group">
    <div class="col-lg-12" id="systemMailTestResult"></div>
  </div>
</div>
<script type="text/javascript" src="systemMailTestSend.js"></script>
