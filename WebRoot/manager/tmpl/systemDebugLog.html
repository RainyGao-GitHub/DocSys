<div class="row">
        <div class="col-md-12">
          <div class="widget">
            <div class="widget-head">
              <div class="pull-left">调试日志</div>
              <div class="widget-icons pull-right">
                <button id="btnSaveSystemDebugLogSet" onclick="saveSystemDebugLogSet()" class="btn btn-lg btn-success examine_ban" disabled="disabled">保存</button>
                <button id="btnCancelSystemDebugLogSet" onclick="cancelSystemDebugLogSet()" class="btn btn-lg btn-warning examine_ban" disabled="disabled">取消</button>
              </div>
              <div class="clearfix"></div>
            </div>

            <div class="widget-content">
              <div id="systemDebugLogForm">
                <!-- 参数名与配置值分列展示（与「邮件服务」「短信服务」页同一套表格样式）：每个参数独占一行，日志文件的运维入口放在表格下方 -->
                <table class="table table-striped table-bordered table-hover" id="systemDebugLogTable">
                  <thead>
                  <tr>
                    <th style="width:220px;">参数</th>
                    <th>配置值</th>
                  </tr>
                  </thead>
                  <tbody>
                  <tr>
                    <td>日志级别</td>
                    <td>
                      <select class="form-control" id="logLevel" style="width:220px;">
                        <option value="0" {{if value.logLevel == 0}} selected="selected" {{/if}}>debug</option>
                        <option value="1" {{if value.logLevel == 1}} selected="selected" {{/if}}>info</option>
                        <option value="2" {{if value.logLevel == 2}} selected="selected" {{/if}}>warn</option>
                        <option value="3" {{if value.logLevel == 3}} selected="selected" {{/if}}>error</option>
                      </select>
                    </td>
                  </tr>
                  <tr>
                    <td>日志输出</td>
                    <td>
                      <label class="checkbox-inline">
                        <input type="checkbox" id="outputToFileEn" {{if value.outputToFileEn == 1}} checked="checked" {{/if}}> 输出到指定文件
                      </label>
                    </td>
                  </tr>
                  <tr>
                    <td>日志文件路径</td>
                    <td>
                      <input type="text" class="form-control" id="logFile" value="{{value.logFile}}" placeholder="如需输出到指定文件，请指定日志文件路径" {{if value.outputToFileEn != 1}}disabled="disabled"{{/if}} style="width:520px;">
                    </td>
                  </tr>
                  </tbody>
                </table>

                <button onclick="viewLogFile()" data-id="" class="btn btn-lg btn-primary examine_ban">在线查看</button>
                <button onclick="downloadLogFile()" data-id="" class="btn btn-lg btn-warning examine_ban">下载</button>
                <button onclick="cleanLogFile()" data-id="" class="btn btn-lg btn-danger examine_ban"><i class="icon-remove"></i>清除</button>
              </div>
              <div class="widget-foot">
                <div class="clearfix"></div>
              </div>
            </div>
            <!-- Matter ends -->
          </div>
        </div>
</div>
