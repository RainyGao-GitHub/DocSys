<div class="row">
        <div class="col-md-12">
          <div class="widget">
            <div class="widget-head">
              <div class="pull-left">LDAP</div>
              <div class="widget-icons pull-right">
                <button id="btnEnableSystemLdapSet" onclick="enableSystemLdapSet()" class="btn btn-lg btn-success examine_ban">Edit</button>
                <button id="btnSaveSystemLdapSet" onclick="saveSystemLdapSet()" class="btn btn-lg btn-success examine_ban" style="display:none;">Save</button>
                <button id="btnCancelSystemLdapSet" onclick="cancelSystemLdapSet()" class="btn btn-lg btn-warning examine_ban" style="display:none;">Cancel</button>
              </div>
              <div class="clearfix"></div>
            </div>

            <div class="widget-content">
              <div id="systemLdapForm">
                <!-- Parameter/value table style, same as the "Email Service" / "Debug Log" pages: one row per parameter, page actions below the table -->
                <table class="table table-striped table-bordered table-hover" id="systemLdapTable">
                  <thead>
                  <tr>
                    <th style="width:220px;">Parameter</th>
                    <th>Value</th>
                  </tr>
                  </thead>
                  <tbody>
                  <tr>
                    <td>LDAP</td>
                    <td>
                      <input type="text" class="form-control" id="ldapConfig" name="ldapConfig" value="{{value.ldapConfig}}" disabled="disabled" placeholder="ldap://xxx.xxx.xxx.xx:389/ou=xxx,dc=xxx,dc=xxx" style="width:520px;">
                    </td>
                  </tr>
                  </tbody>
                </table>

                <button onclick="ldapTest()" data-id="" class="btn btn-lg btn-warning examine_ban">Test</button>
              </div>
              <div class="widget-foot">
                <div class="clearfix"></div>
              </div>
            </div>
            <!-- Matter ends -->
          </div>
        </div>
</div>
