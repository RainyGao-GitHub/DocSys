<div class="row">
        <div class="col-md-12">
          <div class="widget">
            <div class="widget-head">
              <div class="pull-left">System Settings</div>
              <div class="widget-icons pull-right">
                  <div class="form-inline">
                      <button onclick="showAddSystemSettingPanel()" class="btn btn-md btn-success examine_ban">New Setting</button>
                      <div class="form-group">
                          <input type="input" class="form-control" id="search-systemSetting" placeholder="Name / Value / Remark">
                      </div>
                      <button onclick="searchSystemSetting()" class="btn btn-md btn-primary" style="margin-left: 0px;">Search</button>
                      <button onclick="exportSystemSetting()" class="btn btn-md btn-primary" style="margin-left: 3px;">Export</button>
                      <button onclick="importSystemSetting()" class="btn btn-md btn-primary" style="margin-left: 3px;">Import</button>
                      <input type="file" id="importSystemSettingFile" accept=".json,application/json" style="display:none" onchange="importSystemSettingFileChanged(this)">
                  </div>
              </div>
              <div class="clearfix"></div>
            </div>

            <div class="widget-content">

              <table class="table table-striped table-bordered table-hover" id="systemSetting_list">
                <thead>
                <tr>
                  <th style="width:50px;">#</th>
                  <th style="width:220px;">Name</th>
                  <th>Value</th>
                  <th style="width:200px;">Remark</th>
                  <th style="width:150px;">Create Time</th>
                  <th style="width:150px;">Update Time</th>
                  <th style="width:150px;">Operation</th>
                </tr>
                </thead>
                <tbody>

                {{each list as value i}}
                  <tr index="{{i}}">
                    <td>{{value.index}}</td>
                    <td>{{value.name}}</td>
                    <td style="max-width:600px;word-break:break-all;">{{value.displayValue}}</td>
                    <td>{{value.remark}}</td>
                    <td>{{value.createTime}}</td>
                    <td>{{value.updateTime}}</td>
                    <td class="edit">
                      <button onclick="showEditSystemSettingPanel('{{value.name}}')" class="btn btn-lg btn-success examine_ban"><i class="icon-pencil"></i>Edit</button>
                      <button onclick="deleteSystemSettingConfirm('{{value.name}}')" class="btn btn-lg btn-danger examine_ban"><i class="icon-remove"></i>Delete</button>
                    </td>
                  </tr>
                {{/each}}
                </tbody>
              </table>

              <div class="widget-foot">
                  <!-- pagination -->
                  <div id="systemSettingList-pagination" class="l-page"></div>

              </div>

            </div>
            <!-- Matter ends -->
          </div>
        </div>
      </div>
