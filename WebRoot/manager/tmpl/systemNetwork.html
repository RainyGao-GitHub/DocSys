<div class="row">
        <div class="col-md-12">
          <div class="widget">
            <div class="widget-head">
              <div class="pull-left">安全网络设置</div>
              <div class="widget-icons pull-right">
                <button id="btnEnableSystemNetworkSet" onclick="enableSystemNetworkSet()" class="btn btn-lg btn-success examine_ban">编辑</button>
                <button id="btnSaveSystemNetworkSet" onclick="saveSystemNetworkSet()" class="btn btn-lg btn-success examine_ban" style="display:none;">保存</button>
                <button id="btnCancelSystemNetworkSet" onclick="cancelSystemNetworkSet()" class="btn btn-lg btn-warning examine_ban" style="display:none;">取消</button>
              </div>
              <div class="clearfix"></div>
            </div>

            <div class="widget-content">
              <div id="systemNetworkForm" style="margin-top: 20px;">
                <!-- 参数名与配置值分列展示（与「邮件服务」「调试日志」页同一套表格样式）：每个参数独占一行 -->
                <table class="table table-striped table-bordered table-hover" id="systemNetworkTable">
                  <thead>
                  <tr>
                    <th style="width:220px;">参数</th>
                    <th>配置值</th>
                  </tr>
                  </thead>
                  <tbody>
                  <tr>
                    <td>安全网络设置</td>
                    <td>
                      <input type="text" class="form-control" id="allowedNetworkConfig" name="allowedNetworkConfig" value="{{value.allowedNetworkConfig}}" disabled="disabled" placeholder="192.168.0.*; 192.168.1.1-10; 192.168.2-16.*;" style="width:520px;">
                    </td>
                  </tr>
                  </tbody>
                </table>
              </div>
              <div class="widget-foot">
                <div class="clearfix"></div>
              </div>
            </div>
            <!-- Matter ends -->
          </div>
        </div>
</div>
