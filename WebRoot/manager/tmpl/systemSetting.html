<div class="row">
        <div class="col-md-12">
          <div class="widget">
            <div class="widget-head">
              <div class="pull-left">系统参数</div>
              <div class="widget-icons pull-right">
                  <div class="form-inline">
                      <button onclick="showAddSystemSettingPanel()" class="btn btn-md btn-success examine_ban">新增配置</button>
                      <div class="form-group">
                          <input type="input" class="form-control" id="search-systemSetting" placeholder="请输入配置名/配置值/备注关键字">
                      </div>
                      <button onclick="searchSystemSetting()" class="btn btn-md btn-primary" style="margin-left: 0px;">搜索</button>
                      <button onclick="exportSystemSetting()" class="btn btn-md btn-primary" style="margin-left: 3px;">导出</button>
                      <button onclick="importSystemSetting()" class="btn btn-md btn-primary" style="margin-left: 3px;">导入</button>
                      <input type="file" id="importSystemSettingFile" accept=".json,application/json" style="display:none" onchange="importSystemSettingFileChanged(this)">
                  </div>
              </div>
              <div class="clearfix"></div>
            </div>

            <div class="widget-content">

              <table class="table table-striped table-bordered table-hover" id="systemSetting_list" style="table-layout:fixed;">
                <thead>
                <tr>
                  <th style="width:40px;">#</th>
                  <th style="width:14%;">配置名称</th>
                  <th>配置值</th>
                  <th style="width:9%;">备注</th>
                  <th style="width:88px;">创建时间</th>
                  <th style="width:88px;">更新时间</th>
                  <th style="width:84px;">操作</th>
                </tr>
                </thead>
                <tbody>

                {{each list as value i}}
                  <tr index="{{i}}">
                    <td>{{value.index}}</td>
                    <td style="word-break:break-all;">{{value.name}}</td>
                    <td style="word-break:break-all;">{{value.displayValue}}</td>
                    <td style="word-break:break-all;">{{value.remark}}</td>
                    <td>{{value.createTime}}</td>
                    <td>{{value.updateTime}}</td>
                    <td class="edit">
                      <button onclick="showEditSystemSettingPanel('{{value.name}}')" class="btn btn-lg btn-success examine_ban"><i class="icon-pencil"></i>编辑</button>
                      <button onclick="deleteSystemSettingConfirm('{{value.name}}')" class="btn btn-lg btn-danger examine_ban"><i class="icon-remove"></i>删除</button>
                    </td>
                  </tr>
                {{/each}}
                </tbody>
              </table>

              <div class="widget-foot">
                  <!-- 组件footer，渲染分页插件 -->
                  <div id="systemSettingList-pagination" class="l-page"></div>

              </div>

            </div>
            <!-- Matter ends -->
          </div>
        </div>
      </div>
