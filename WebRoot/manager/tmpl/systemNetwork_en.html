<div class="row">
        <div class="col-md-12">
          <div class="widget">
            <div class="widget-head">
              <div class="pull-left">Allowed Network</div>
              <div class="widget-icons pull-right">
                <button id="btnEnableSystemNetworkSet" onclick="enableSystemNetworkSet()" class="btn btn-lg btn-success examine_ban">Edit</button>
                <button id="btnSaveSystemNetworkSet" onclick="saveSystemNetworkSet()" class="btn btn-lg btn-success examine_ban" style="display:none;">Save</button>
                <button id="btnCancelSystemNetworkSet" onclick="cancelSystemNetworkSet()" class="btn btn-lg btn-warning examine_ban" style="display:none;">Cancel</button>
              </div>
              <div class="clearfix"></div>
            </div>

            <div class="widget-content">
              <div id="systemNetworkForm">
                <!-- Parameter/value table style, same as the "Email Service" / "Debug Log" pages: one row per parameter -->
                <table class="table table-striped table-bordered table-hover" id="systemNetworkTable">
                  <thead>
                  <tr>
                    <th style="width:220px;">Parameter</th>
                    <th>Value</th>
                  </tr>
                  </thead>
                  <tbody>
                  <tr>
                    <td>Allowed Network</td>
                    <td>
                      <input type="text" class="form-control" id="allowedNetworkConfig" name="allowedNetworkConfig" value="{{value.allowedNetworkConfig}}" disabled="disabled" placeholder="192.168.0.*; 192.168.1.1-10; 192.168.2-16.*;" style="width:520px;">
                    </td>
                  </tr>
                  </tbody>
                </table>
              </div>
              <div class="widget-foot">
                <div class="clearfix"></div>
              </div>
            </div>
            <!-- Matter ends -->
          </div>
        </div>
</div>
