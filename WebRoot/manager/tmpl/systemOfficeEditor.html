<div class="row">
        <div class="col-md-12">
          <div class="widget">
            <div class="widget-head">
              <div class="pull-left">Office编辑器</div>
              <div class="widget-icons pull-right">
                <button id="btnEnableSystemOfficeEditorSet" onclick="enableSystemOfficeEditorSet()" class="btn btn-lg btn-success examine_ban">编辑</button>
                <button id="btnSaveSystemOfficeEditorSet" onclick="saveSystemOfficeEditorSet()" class="btn btn-lg btn-success examine_ban" style="display:none;">保存</button>
                <button id="btnCancelSystemOfficeEditorSet" onclick="cancelSystemOfficeEditorSet()" class="btn btn-lg btn-warning examine_ban" style="display:none;">取消</button>
              </div>
              <div class="clearfix"></div>
            </div>

            <div class="widget-content">
              <div id="systemOfficeForm">
                <!-- 参数名与配置值分列展示（与「邮件服务」「调试日志」页同一套表格样式）：每个参数独占一行，页级操作按钮放在表格下方 -->
                <table class="table table-striped table-bordered table-hover" id="systemOfficeTable">
                  <thead>
                  <tr>
                    <th style="width:220px;">参数</th>
                    <th>配置值</th>
                  </tr>
                  </thead>
                  <tbody>
                  <tr>
                    <td>Office引擎</td>
                    <td>
                      <select class="form-control" id="isOnlyOfficeUsed" disabled="disabled" style="width:220px;">
                        <option value="0" {{if value.isOnlyOfficeUsed != 1}}selected="selected"{{/if}}>默认</option>
                        <option value="1" {{if value.isOnlyOfficeUsed == 1}}selected="selected"{{/if}}>OnlyOffice</option>
                      </select>
                    </td>
                  </tr>
                  <tr>
                    <td>字体库状态</td>
                    <td>
                      <span id="officeFontsStatus">正在获取...</span>
                    </td>
                  </tr>
                  <tr>
                    <td>字体库缺失时自动生成</td>
                    <td>
                      <select class="form-control" id="officeAutoGenerateFonts" disabled="disabled" style="width:220px;">
                        <option value="1" {{if value.officeAutoGenerateFonts != 0}}selected="selected"{{/if}}>开启</option>
                        <option value="0" {{if value.officeAutoGenerateFonts == 0}}selected="selected"{{/if}}>关闭</option>
                      </select>
                      <div style="color:#888;font-size:12px;">开启后：新安装/在线升级导致字体库缺失时，由前端自动检测并生成（首次约 10-30 分钟，期间无法使用Office）；自动生成失败一次后不再重试，改为提示管理员手动「重置字体库」。</div>
                    </td>
                  </tr>
                  </tbody>
                </table>

                <button onclick="addOfficeFonts()" data-id="" class="btn btn-lg btn-warning examine_ban">添加字体...</button>
                <button onclick="generateOfficeFontsConfirm()" data-id="" class="btn btn-lg btn-success examine_ban">重置字体库</button>
                <button id="btnDisableOffice" onclick="disableOffice()" data-id="" class="btn btn-lg btn-danger examine_ban" {{if value.officeDisabled == 1}} style="display:none" {{/if}}>禁用</button>
                <button id="btnEnableOffice" onclick="enableOffice()" data-id="" class="btn btn-lg btn-success examine_ban" {{if value.officeDisabled == 0}} style="display:none" {{/if}}>启用</button>
              </div>
              <div class="widget-foot">
                <div class="clearfix"></div>
              </div>
            </div>
            <!-- Matter ends -->
          </div>
        </div>
</div>
