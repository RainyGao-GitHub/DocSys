<div class="row">
        <div class="col-md-12">
          <div class="widget">
            <div class="widget-head">
              <div class="pull-left">AI接入设置</div>
              <div class="widget-icons pull-right">
                <button id="btnEnableSystemLlmSet" onclick="enableSystemLlmSet()" class="btn btn-lg btn-success examine_ban">编辑</button>
                <button id="btnSaveSystemLlmSet" onclick="saveSystemLlmSet()" class="btn btn-lg btn-success examine_ban" style="display:none;">保存</button>
                <button id="btnCancelSystemLlmSet" onclick="cancelSystemLlmSet()" class="btn btn-lg btn-warning examine_ban" style="display:none;">取消</button>
              </div>
              <div class="clearfix"></div>
            </div>

            <div class="widget-content">
              <div id="systemLlmForm">
                <!-- 参数名与配置值分列展示（与「邮件服务」「调试日志」页同一套表格样式）：每个参数独占一行，页级操作按钮放在表格下方 -->
                <table class="table table-striped table-bordered table-hover" id="systemLlmTable">
                  <thead>
                  <tr>
                    <th style="width:220px;">参数</th>
                    <th>配置值</th>
                  </tr>
                  </thead>
                  <tbody>
                  <tr>
                    <td>AI接入设置</td>
                    <td>
                      <input type="text" class="form-control" id="llmConfig" name="llmConfig" value="{{value.llmConfig}}" disabled="disabled" placeholder="https://api.deepseek.com; apikey=sk-xxx; modelName=deepseek-chat; name=deepseek; " style="width:520px;">
                    </td>
                  </tr>
                  </tbody>
                </table>

                <button onclick="llmTest()" data-id="" class="btn btn-lg btn-warning examine_ban">测试</button>
              </div>
              <div class="widget-foot">
                <div class="clearfix"></div>
              </div>
            </div>
            <!-- Matter ends -->
          </div>
        </div>
</div>
