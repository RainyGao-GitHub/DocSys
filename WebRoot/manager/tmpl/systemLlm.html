<div class="row">
        <div class="col-md-12">
          <div class="widget">
            <div class="widget-head">
              <div class="pull-left">AI接入设置</div>
              <div class="widget-icons pull-right">
                <button id="btnAddSystemLlmModel" onclick="addSystemLlmModel()" class="btn btn-lg btn-success examine_ban">新增模型</button>
                <button id="btnSaveSystemLlmSet" onclick="saveSystemLlmSet()" class="btn btn-lg btn-success examine_ban" disabled="disabled">保存</button>
                <button id="btnCancelSystemLlmSet" onclick="cancelSystemLlmSet()" class="btn btn-lg btn-warning examine_ban" disabled="disabled">取消</button>
              </div>
              <div class="clearfix"></div>
            </div>

            <div class="widget-content">
              <div id="systemLlmForm">
                <!-- 模型列表：顺序即优先级，第 1 个「启用」的模型是默认模型（= 运行期配置串的第 1 条） -->
                <table class="table table-striped table-bordered table-hover" id="systemLlmTable">
                  <thead>
                  <tr>
                    <th style="width:150px;">模型名称</th>
                    <th>接口地址 / 模型标识 / API Key</th>
                    <th style="width:76px;">状态</th>
                    <th style="width:76px;">操作</th>
                  </tr>
                  </thead>
                  <tbody id="systemLlmModelRows">
                  {{each value.models as model i}}
                  <tr>
                    <td>{{model.name}}</td>
                    <td style="word-break:break-all;">
                      <div>{{model.endpoint}}</div>
                      <div style="color:#888;">{{model.modelName}}{{if model.apiKey}} · {{model.apiKey}}{{/if}}</div>
                    </td>
                    <td>
                      <label class="checkbox-inline" style="white-space:nowrap;">
                        <input type="checkbox" {{if model.enabled}}checked="checked"{{/if}} onclick="toggleSystemLlmModel({{i}})"> {{if model.enabled}}启用{{else}}停用{{/if}}
                      </label>
                    </td>
                    <td>
                      <button onclick="testSystemLlmModel({{i}})" class="btn btn-warning examine_ban">测试</button>
                      <button onclick="editSystemLlmModel({{i}})" class="btn btn-success examine_ban">编辑</button>
                      <button onclick="moveSystemLlmModelToTop({{i}})" class="btn btn-primary examine_ban" title="移到第一位（列表第 1 个启用的模型即默认模型）" {{if i == 0}}disabled="disabled"{{/if}}>置顶</button>
                      <button onclick="deleteSystemLlmModel({{i}})" class="btn btn-danger examine_ban">删除</button>
                    </td>
                  </tr>
                  {{/each}}
                  {{if value.models.length == 0}}
                  <tr>
                    <td colspan="4" style="text-align:center;color:#999;">还没有配置模型，点右上角「新增模型」开始</td>
                  </tr>
                  {{/if}}
                  </tbody>
                </table>
              </div>
              <div class="widget-foot">
                <div class="clearfix"></div>
              </div>
            </div>
            <!-- Matter ends -->
          </div>
        </div>
</div>
