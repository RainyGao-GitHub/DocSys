<div class="row">
        <div class="col-md-12">
          <div class="widget">
            <div class="widget-head">
              <div class="pull-left">AI Access</div>
              <div class="widget-icons pull-right">
                <button id="btnEnableSystemLlmSet" onclick="enableSystemLlmSet()" class="btn btn-lg btn-success examine_ban">Edit</button>
                <button id="btnSaveSystemLlmSet" onclick="saveSystemLlmSet()" class="btn btn-lg btn-success examine_ban" style="display:none;">Save</button>
                <button id="btnCancelSystemLlmSet" onclick="cancelSystemLlmSet()" class="btn btn-lg btn-warning examine_ban" style="display:none;">Cancel</button>
              </div>
              <div class="clearfix"></div>
            </div>

            <div class="widget-content">
              <div id="systemLlmForm">
                <!-- Parameter/value table style, same as the "Email Service" / "Debug Log" pages: one row per parameter, page actions below the table -->
                <table class="table table-striped table-bordered table-hover" id="systemLlmTable">
                  <thead>
                  <tr>
                    <th style="width:220px;">Parameter</th>
                    <th>Value</th>
                  </tr>
                  </thead>
                  <tbody>
                  <tr>
                    <td>AI Access</td>
                    <td>
                      <input type="text" class="form-control" id="llmConfig" name="llmConfig" value="{{value.llmConfig}}" disabled="disabled" placeholder="https://api.deepseek.com/v1/chat/completions; apikey=sk-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx;" style="width:520px;">
                    </td>
                  </tr>
                  </tbody>
                </table>

                <button onclick="llmTest()" data-id="" class="btn btn-lg btn-warning examine_ban">Test</button>
              </div>
              <div class="widget-foot">
                <div class="clearfix"></div>
              </div>
            </div>
            <!-- Matter ends -->
          </div>
        </div>
</div>
