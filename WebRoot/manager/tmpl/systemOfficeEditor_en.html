<div class="row">
        <div class="col-md-12">
          <div class="widget">
            <div class="widget-head">
              <div class="pull-left">Office Editor</div>
              <div class="widget-icons pull-right">
                <button id="btnEnableSystemOfficeEditorSet" onclick="enableSystemOfficeEditorSet()" class="btn btn-lg btn-success examine_ban">Edit</button>
                <button id="btnSaveSystemOfficeEditorSet" onclick="saveSystemOfficeEditorSet()" class="btn btn-lg btn-success examine_ban" style="display:none;">Save</button>
                <button id="btnCancelSystemOfficeEditorSet" onclick="cancelSystemOfficeEditorSet()" class="btn btn-lg btn-warning examine_ban" style="display:none;">Cancel</button>
              </div>
              <div class="clearfix"></div>
            </div>

            <div class="widget-content">
              <div id="systemOfficeForm" style="margin-top: 20px;">
                <!-- Parameter/value table style, same as the "Email Service" / "Debug Log" pages: one row per parameter, page actions below the table -->
                <table class="table table-striped table-bordered table-hover" id="systemOfficeTable">
                  <thead>
                  <tr>
                    <th style="width:220px;">Parameter</th>
                    <th>Value</th>
                  </tr>
                  </thead>
                  <tbody>
                  <tr>
                    <td>OfficeEditor</td>
                    <td>
                      <label class="checkbox-inline">
                        <input type="checkbox" id="isOnlyOfficeUsed" {{if value.isOnlyOfficeUsed == 1}} checked="checked" {{/if}} onclick="selectIsOnlyOfficeUsed()" disabled="disabled"> OnlyOffice
                      </label>
                    </td>
                  </tr>
                  </tbody>
                </table>

                <button onclick="addOfficeFonts()" data-id="" class="btn btn-lg btn-warning examine_ban">Install Fonts...</button>
                <button onclick="generateOfficeFontsConfirm()" data-id="" class="btn btn-lg btn-success examine_ban">Reset Fonts</button>
                <button id="btnDisableOffice" onclick="disableOffice()" data-id="" class="btn btn-lg btn-danger examine_ban" {{if value.officeDisabled == 1}} style="display:none" {{/if}}>Disable</button>
                <button id="btnEnableOffice" onclick="enableOffice()" data-id="" class="btn btn-lg btn-success examine_ban" {{if value.officeDisabled == 0}} style="display:none" {{/if}}>Enable</button>
              </div>
              <div class="widget-foot">
                <div class="clearfix"></div>
              </div>
            </div>
            <!-- Matter ends -->
          </div>
        </div>
</div>
