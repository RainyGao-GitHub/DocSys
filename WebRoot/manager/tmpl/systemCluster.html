<div class="row">
        <div class="col-md-12">
          <div class="widget">
            <div class="widget-head">
              <div class="pull-left">集群部署设置</div>
              <div class="widget-icons pull-right">
                <button id="btnEnableSystemClusterSet" onclick="enableSystemClusterSet()" class="btn btn-lg btn-success examine_ban">编辑</button>
                <button id="btnSaveSystemClusterSet" onclick="saveSystemClusterSet()" class="btn btn-lg btn-success examine_ban" style="display:none;">保存</button>
                <button id="btnCancelSystemClusterSet" onclick="cancelSystemClusterSet()" class="btn btn-lg btn-warning examine_ban" style="display:none;">取消</button>
              </div>
              <div class="clearfix"></div>
            </div>

            <div class="widget-content">
              <div id="systemClusterForm">
                <!-- 参数名与配置值分列展示（与「邮件服务」「调试日志」页同一套表格样式）：每个参数独占一行，页级操作按钮放在表格下方 -->
                <table class="table table-striped table-bordered table-hover" id="systemClusterTable">
                  <thead>
                  <tr>
                    <th style="width:220px;">参数</th>
                    <th>配置值</th>
                  </tr>
                  </thead>
                  <tbody>
                  <tr>
                    <td>集群部署</td>
                    <td>
                      <label class="checkbox-inline">
                        <input type="checkbox" id="redisEn" {{if value.redisEn == 1}} checked="checked" {{/if}} onclick="selectRedisEn()" disabled="disabled"> 启用
                      </label>
                    </td>
                  </tr>
                  <tr>
                    <td>Redis服务器地址</td>
                    <td>
                      <input type="text" class="form-control" id="redisUrl" value="{{value.redisUrl}}" placeholder="请填写redis服务器地址,例如：redis://localhost:6379" disabled="disabled" style="width:520px;">
                    </td>
                  </tr>
                  <tr>
                    <td>集群服务器地址</td>
                    <td>
                      <input type="text" class="form-control" id="clusterServerUrl" value="{{value.clusterServerUrl}}" placeholder="请填写集群服务器地址,例如：http://localhost:8100" disabled="disabled" style="width:520px;">
                    </td>
                  </tr>
                  <tr>
                    <td>集群状态</td>
                    <td>
                      <textarea class="form-control" id="clusterInfo" rows="3" disabled="disabled" style="width:520px;">{{value.clusterInfo}}</textarea>
                    </td>
                  </tr>
                  </tbody>
                </table>

                <button onclick="testCluster()" data-id="" class="btn btn-lg btn-warning examine_ban">测试</button>
                <button onclick="resetClusterConfirm()" data-id="" class="btn btn-lg btn-danger examine_ban">重置</button>
              </div>
              <div class="widget-foot">
                <div class="clearfix"></div>
              </div>
            </div>
            <!-- Matter ends -->
          </div>
        </div>
</div>
