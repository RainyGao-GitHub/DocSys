<div class="form-horizontal">
  <div class="form-group">
    <label class="control-label col-lg-3">用户名单文件</label>
    <div class="col-lg-9">
      <button type="button" class="btn btn-default" onclick="importUserSelectFile()">选择文件</button>
      <span id="importUserFileName" style="margin-left:8px;color:#888;">未选择文件</span>
      <div style="margin-top:6px;">
        <button type="button" class="btn btn-link" style="padding-left:0;" onclick="downloadUserImportTemplate()">下载导入模板</button>
      </div>
    </div>
  </div>

  <div class="form-group">
    <label class="control-label col-lg-3">说明</label>
    <div class="col-lg-9" style="padding-top:7px;color:#888;line-height:20px;">
      支持 CSV / XLS / XLSX / WPS ET 文件，单个文件不超过 5MB、不超过 5000 行。<br>
      首行必须是列名（例如：用户名、密码、名字、昵称、手机、邮箱、角色），列顺序任意，系统会自动识别常见的中英文列名，多余的列会被忽略。<br>
      账号已存在的行会被跳过并列出；文件里没有密码列时，默认密码 = 账号本身。
    </div>
  </div>

  <div class="form-group">
    <div class="col-lg-offset-3 col-lg-9">
      <button type="button" class="btn btn-success" id="btn_importUser" onclick="startImportUser()">开始导入</button>
      <span id="importUserProgress" style="margin-left:10px;color:#888;"></span>
    </div>
  </div>

  <div class="form-group" id="importUserResultGroup" style="display:none;">
    <div class="col-lg-offset-3 col-lg-9">
      <div id="importUserResultSummary" style="font-weight:bold;margin-bottom:6px;"></div>
      <div style="max-height:300px;overflow:auto;">
        <table class="table table-striped table-bordered table-hover" id="importUserResultTable" style="margin-bottom:0;">
          <thead>
            <tr>
              <th style="width:56px;">行号</th>
              <th style="width:56px;">状态</th>
              <th style="width:120px;">账号</th>
              <th>原因</th>
            </tr>
          </thead>
          <tbody id="importUserResultBody"></tbody>
        </table>
      </div>
      <div style="color:#888;margin-top:6px;">失败/跳过超过 500 条时只列出前面 500 条。</div>
    </div>
  </div>
</div>

<script type="text/javascript" src="importUser.js"></script>
