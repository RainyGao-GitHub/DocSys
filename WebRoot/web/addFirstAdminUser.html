<style type="text/css">
.dataRootCombo { position: relative; }
.dataRootCombo .dataRootComboInput { width: 100%; height: 38px; border-radius: 8px; border: 1px solid #d8e4f2; padding: 8px 38px 8px 10px; font-size: 13px; color: #22324a; box-shadow: none; }
.dataRootCombo .dataRootComboInput:focus { border-color: #7ba2d6; box-shadow: 0 0 0 3px rgba(123,162,214,0.12); }
.dataRootComboToggle { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 26px; height: 26px; border: 0; background: transparent; color: #6d8095; padding: 0; }
.dataRootComboToggle:hover { color: #22324a; }
.dataRootChevron { display: inline-block; font-size: 16px; line-height: 1; transform: translateY(-2px); }
.dataRootDropdown { position: fixed; z-index: 2000; background: #fff; border: 1px solid #e6eef8; border-radius: 10px; box-shadow: 0 12px 30px rgba(15,35,60,0.16); padding: 6px; max-height: 260px; overflow-y: auto; display: none; }
.dataRootOption { padding: 9px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; color: #22324a; line-height: 18px; word-break: break-all; }
.dataRootOption:hover, .dataRootOption.active { background: #eef5fd; }
.dataRootOption.selected { background: #e3effc; font-weight: 600; }
</style>
<div class="form-horizontal">
	<div class="form-group" id="userIdDiv">
		<label class="col-sm-2 control-label">用户名</label>
		<div class="col-sm-10">
            <input type="text" id="userName" name="userName" class="form-control"  maxlength="40" />
		</div>
	</div>
    <div class="form-group">
        <label class="col-sm-2 control-label">密 码</label>
        <div class="col-sm-10">
            <input type="password" id="pwd" name="pwd" needvalicate="true" valicate="_required _minlen=6" class="form-control" placeholder="6-18位，可由数字字母特殊字符组成"/>
        </div>
    </div>
    <div class="form-group">
        <label class="col-sm-2 control-label">确认密码</label>
        <div class="col-sm-10">
            <input type="password" id="pwd2" name="pwd2" needvalicate="true" valicate="_required _minlen=6 _equals=pwdForReg" class="form-control" placeholder="请确认密码"/>
        </div>
    </div>
	<div class="form-group" id="userIdDiv">
		<label class="col-sm-2 control-label">手机</label>
		<div class="col-sm-10">
            <input type="text" id="tel" name="tel" class="form-control"  maxlength="40" needvalicate="true" valicate="_required _emailOR_tel _minlen=6" placeholder="请填写您的有效手机，以便找回密码以及验证" />
		</div>
	</div>
	<div class="form-group" id="userIdDiv">
		<label class="col-sm-2 control-label">邮箱</label>
		<div class="col-sm-10">
            <input type="text" id="email" name="email" class="form-control"  maxlength="80" needvalicate="true" valicate="_required _emailOR_tel _minlen=6" placeholder="请填写您的有效邮箱，以便找回密码以及验证" />
		</div>
	</div>
	<div class="form-group">
		<label class="col-sm-2 control-label" style="white-space:nowrap;">数据根目录</label>
		<div class="col-sm-10">
			<div class="dataRootCombo" id="dataRootCombo">
				<input type="text" id="dataRoot" name="dataRoot" class="form-control dataRootComboInput" placeholder="例如：/data/MxsDocData/" autocomplete="off" />
				<button type="button" class="dataRootComboToggle" tabindex="-1" aria-label="选择数据根目录"><span class="dataRootChevron">&#8964;</span></button>
			</div>
		</div>
	</div>

	<div class="form-group">
		<div class="col-sm-12 text-center">
			<input id="submitBtn" type="submit" class="hidden"/>
				<button  id="submit" type="button" class="btn btnPrimary" onclick="addFirstAdminUser();" style="width: 288px;height: 42px;">添加</button>
		</div>
	</div>
</div>
                    
<script type="text/javascript" src="js/md5.js"></script>
<script type="text/javascript" src="addFirstAdminUser.js?v=20261021"></script>

		$("#userName").click().focus();
	});
