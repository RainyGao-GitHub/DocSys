<div id="dialog-serverDirSelector" class="form-horizontal">
    <div class="form-group">
    	<ul id="ztreeForServerDirSelector" class="ztree" style="height:380px; overflow-y:auto; margin-bottom: 10px;"></ul>
    	<div style="color:#999; font-size:12px;">单击选中目录，双击直接确定；展开箭头可逐级浏览</div>
    </div>
	<div class="modal-footer">
	    <div class="form-group">
		    <div class="col-sm-12 text-right">
		        <button  type="button" class="btn btnPrimary" onclick="ServerDirSelector.doSelect();" style="width: 100px;height: 42px;">确定</button>
		        <button  type="button" class="btn btnPrimary" onclick="ServerDirSelector.cancelSelect();" style="width: 100px;height: 42px;">取消</button>
			</div>
		</div>
	</div>
</div>

<script type="text/javascript">
var ServerDirSelector = (function () {
	var _config;
	var _selectedNode;

	function zTreeOnClick(event, treeId, treeNode)
	{
		console.log("ServerDirSelector zTreeOnClick:", treeNode);
		_selectedNode = treeNode;
	}

	function zTreeOnDbClick(event, treeId, treeNode)
	{
		console.log("ServerDirSelector zTreeOnDbClick:", treeNode);
		_selectedNode = treeNode;
		doSelect();
	}

	//格式化为 zTree simpleData 节点（id/pId 用绝对路径，天然唯一）
	function formatNode(dir, pId, isOpen)
	{
		return {
			id : dir.path,
			pId : pId,
			name : dir.name,
			path : dir.path,
			isParent : true,	//目录一律可展开（无子目录时展开为空）
			open : isOpen == true,
		};
	}

	function asyncDataFilter(treeId, parentNode, responseData)
	{
		console.log("ServerDirSelector asyncDataFilter parent:", parentNode ? parentNode.path : "");
		var data = responseData.data || {};
		var dirList = data.dirList || [];
		var nodes = [];
		for(var i = 0; i < dirList.length; i++)
		{
			nodes.push(formatNode(dirList[i], parentNode ? parentNode.path : "root", false));
		}
		return nodes;
	}

	function zTreeInit(initData)
	{
		var data = initData.data || {};
		var roots = data.roots || [];
		var chain = data.chain || [];
		var dirList = data.dirList || [];

		//树根 = 盘符列表；若带初始路径则沿祖先链自动展开到目标目录并显示其子目录
		var nodes = [];
		for(var i = 0; i < roots.length; i++)
		{
			nodes.push(formatNode(roots[i], "root", false));
		}
		if(chain.length > 0)
		{
			//chain[0] 即盘符根，与 roots 中同路径节点是同一个（simpleData 的 id 不能重复）：直接在根节点上展开
			var rootNode = null;
			for(var k = 0; k < nodes.length; k++)
			{
				if(nodes[k].path == chain[0].path)
				{
					nodes[k].open = true;
					rootNode = nodes[k];
					break;
				}
			}
			if(rootNode)
			{
				//沿祖先链逐级挂子节点（均展开），dirList 统一挂到最后一个链节点下
				var lastPath = chain[0].path;
				for(var i = 1; i < chain.length; i++)
				{
					nodes.push(formatNode(chain[i], lastPath, true));
					lastPath = chain[i].path;
				}
				for(var j = 0; j < dirList.length; j++)
				{
					nodes.push(formatNode(dirList[j], lastPath, false));
				}
			}
		}

        var setting = {
    	   	data: {
           		simpleData: {
               		enable: true,
           		},
           		keep: {
           			leaf: true,
           			parent: true,
           		},
    	   	},
    		callback: {
                onClick: zTreeOnClick,
                onDblClick: zTreeOnDbClick,
    		},
    		async: {
    			enable : true,
    	        url : "/DocSystem/Repos/getServerDirList.do",
    	        type : "post",
    			autoParam : ["path"],
    			dataFilter: asyncDataFilter,
    		},
    	};

    	var zTree = $.fn.zTree.init($("#ztreeForServerDirSelector"), setting, nodes);

    	//自动展开初始路径并选中目标目录
    	if(chain.length > 0)
    	{
    		var targetNode = zTree.getNodeByParam("id", chain[chain.length - 1].path);
    		if(targetNode)
    		{
    			zTree.selectNode(targetNode);
    			_selectedNode = targetNode;
    		}
    	}
	}

	function pageInit(config)
	{
		console.log("ServerDirSelector pageInit() config:", config);
		_config = config || {};
		_selectedNode = null;

		//初始路径取输入框现值（为空则从盘符列表开始）
		$.ajax({
			url : "/DocSystem/Repos/getServerDirList.do",
			type : "post",
			dataType : "json",
			data : { path : _config.path || "" },
			success : function (ret) {
				if("ok" == ret.status)
				{
					zTreeInit(ret);
				}
				else
				{
					showErrorMessage("获取目录失败:" + ret.msgInfo);
					if(_config.path)
					{
						//初始路径无效：回退到盘符列表
						_config.path = "";
						pageInit(_config);
					}
				}
			},
			error : function () {
				showErrorMessage("获取目录失败:服务器异常");
			}
		});
	}

	function doSelect()
	{
		if(_selectedNode == null)
		{
			qiao.bs.msg({msg : _Lang("请选择目录"), type : "warning", time : 2000});
			return;
		}
		_config.onSelect && _config.onSelect(_selectedNode.path);
		closeServerDirSelectorDialog();
	}

	function cancelSelect()
	{
		closeServerDirSelectorDialog();
	}

	function closeServerDirSelectorDialog()
	{
		closeBootstrapDialog("serverDirSelector");
	}

	//开放给外部的调用接口
	return {
		pageInit: function(config){
			pageInit(config);
		},
		doSelect: function(){
			doSelect();
		},
		cancelSelect: function(){
			cancelSelect();
		},
	};
})();
</script>
