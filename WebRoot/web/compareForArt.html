<!DOCTYPE html>
<html style="height: 100%;">
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=0">
	<title>文件对比</title>
	<script type="text/javascript" src="lang/ch.js"></script>
	<script src="static/artDialog/lib/jquery-1.10.2.js" type="text/javascript"></script>
	<script type="text/javascript" src="js/common.js"></script>
	<script type="text/javascript" src="js/base64.js"></script>
	<link rel="stylesheet" href="static/CodeMirror5/lib/codemirror.css?v=20261028">
	<link rel="stylesheet" href="static/CodeMirror5/addon/merge/merge.css?v=20261028">
	<style type="text/css">
		html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: "Microsoft YaHei", Arial, sans-serif; }
		#compareToolBar {
			height: 40px; line-height: 40px; padding: 0 12px; box-sizing: border-box;
			border-bottom: 1px solid #e3e3e8; background: #fafafc;
			display: flex; align-items: center; gap: 8px;
		}
		.compare-btn {
			display: inline-block; height: 26px; line-height: 26px; padding: 0 10px;
			border: 1px solid #d8d8e0; border-radius: 4px; background: #fff;
			font-size: 12px; color: #555; cursor: pointer; user-select: none;
		}
		.compare-btn:hover { background: #f0f0f4; }
		.compare-btn-on { background: #e8f0fe; border-color: #1976d2; color: #1976d2; }
		#compareStats { font-size: 12px; color: #888; margin-left: 8px; }
		#compareHeaderRow {
			display: flex; border-bottom: 1px solid #e3e3e8; background: #f6f6fa;
		}
		.compare-title {
			flex: 1; padding: 6px 12px; font-size: 13px; color: #333;
			white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
		}
		.compare-title + .compare-title { border-left: 1px solid #e3e3e8; }
		.compare-title .tag {
			font-size: 11px; color: #fff; background: #1976d2; border-radius: 3px;
			padding: 1px 5px; margin-right: 6px;
		}
		#compareContainer { position: absolute; top: 76px; bottom: 0; left: 0; right: 0; }
		#compareMsg { position: absolute; top: 76px; bottom: 0; left: 0; right: 0; display: none; }
		.compare-tip {
			margin: 60px auto; max-width: 70%; text-align: center;
			color: #666; font-size: 14px; line-height: 2;
			border: 1px dashed #d8d8e0; border-radius: 8px; padding: 24px; background: #fafafc;
			white-space: pre-wrap; word-break: break-all;
		}
		.CodeMirror { height: 100%; font-family: Consolas, Menlo, monospace; font-size: 13px; }
.dir-compare { position: absolute; top: 0; bottom: 0; left: 0; right: 0; display: flex; flex-direction: column; }
		.dir-filterbar { padding: 8px 12px; border-bottom: 1px solid #e3e3e8; display: flex; gap: 6px; background: #fafafc; }
		.dir-table { flex: 1; overflow: auto; font-size: 13px; }
		.dir-row { display: flex; align-items: center; padding: 5px 14px; border-bottom: 1px solid #f0f0f4; }
		.dir-row.dir-head { position: sticky; top: 0; background: #f6f6fa; color: #888; font-size: 12px; z-index: 1; }
		.dir-row.dir-toggle { cursor: pointer; }
		.dir-row.dir-toggle:hover { background: #eef4ff; }
		.dir-st { width: 30px; }
		.dir-twist { width: 22px; flex: none; text-align: center; color: #555; }
		.dir-name { flex: 1; min-width: 0; font-family: Consolas, Menlo, monospace; color: #333; word-break: break-all; }
		.dir-name + .dir-name { border-left: 1px solid #f0f0f4; }
		.dir-dim { color: #c8c8d0; }
		.office-compare { position: absolute; top: 0; bottom: 0; left: 0; right: 0; display: flex; }
		.office-frame { flex: 1; border: 0; width: 50%; height: 100%; }
		.office-frame-r { border-left: 1px solid #e3e3e8; }
		.dir-stat { width: 180px; text-align: right; color: #666; font-size: 12px; }
		.dir-more { padding: 8px 14px; color: #b8860b; font-size: 12px; }
		.dir-breadcrumb { padding: 6px 12px; background: #f6f6fa; border-bottom: 1px solid #e3e3e8; font-size: 13px; }
		.dir-breadcrumb a { color: #1976d2; text-decoration: none; }
		.CodeMirror-merge { height: 100%; }
		.CodeMirror-merge-pane { height: 100%; }
	</style>
</head>
<body style="height: 100%;">
	<div id="compareToolBar">
		<span class="compare-btn compare-btn-on" id="btnCollapse">折叠相同段</span>
		<span class="compare-btn" id="btnIgnoreWs">忽略空白差异</span>
		<span id="compareStats"></span>
		<span style="flex:1"></span>
		<span class="compare-btn" id="btnClose">关闭</span>
	</div>
	<div id="compareHeaderRow">
		<div class="compare-title" id="compareLeftTitle"><span class="tag">左 · 基准</span></div>
		<div class="compare-title" id="compareRightTitle"><span class="tag">右 · 对比</span></div>
	</div>
	<div id="compareContainer"></div>
	<div id="compareMsg"></div>

	<script type="text/javascript" src="static/CodeMirror5/lib/codemirror.min.js?v=20261028"></script>
	<script type="text/javascript" src="static/CodeMirror5/mode/javascript/javascript.min.js?v=20261028"></script>

	<script type="text/javascript" src="static/CodeMirror5/mode/htmlmixed/htmlmixed.min.js?v=20261028"></script>
	<script type="text/javascript" src="static/CodeMirror5/mode/clike/clike.min.js?v=20261028"></script>
	<script type="text/javascript" src="static/CodeMirror5/mode/python/python.min.js?v=20261028"></script>
	<script type="text/javascript" src="static/CodeMirror5/mode/sql/sql.min.js?v=20261028"></script>
	<script type="text/javascript" src="static/CodeMirror5/mode/markdown/markdown.min.js?v=20261028"></script>
	<script type="text/javascript" src="static/CodeMirror5/mode/shell/shell.min.js?v=20261028"></script>
	<script type="text/javascript" src="static/CodeMirror5/mode/yaml/yaml.min.js?v=20261028"></script>
	<script type="text/javascript" src="static/CodeMirror5/mode/properties/properties.min.js?v=20261028"></script>
	<script type="text/javascript" src="static/CodeMirror5/mode/go/go.min.js?v=20261028"></script>
	<script type="text/javascript" src="static/CodeMirror5/mode/php/php.min.js?v=20261028"></script>
	<script type="text/javascript" src="static/CodeMirror5/mode/ruby/ruby.min.js?v=20261028"></script>
	<script type="text/javascript" src="static/diff-match-patch/diff_match_patch.js?v=20261028"></script>
	<script type="text/javascript" src="static/CodeMirror5/addon/merge/merge.min.js?v=20261028"></script>
	<script type="text/javascript" src="js/DocCompare.js?v=20261031f"></script>
	<script type="text/javascript">
		$(document).ready(function () {
			DocCompare.init(window.COMPARE_LANG = {

				loading: '正在获取两侧文件内容…',

				binaryUnsupported: '该类型文件暂不支持对比\n支持：文本/代码文件（Office 并排预览将在下一版本提供）',
				mixedUnsupported: '暂不支持文件与目录混合对比\n请两侧同为文件或同为目录',

				dirOnlyLeft: '仅左侧', dirOnlyRight: '仅右侧', dirDiffer: '内容不同', dirSame: '相同',
				filterDiff: '有差异', filterOnlyLeft: '仅左侧', filterOnlyRight: '仅右侧', filterSame: '相同', filterAll: '全部',
				typeMismatch: '类型不同（一侧文件一侧目录）', sameSizeOnly: '大小相同（未比对内容）',
				sizeDiff: '大小不同', readFail: '读取失败',
				tooManyRows: '条目过多，仅显示前 300 行（可筛选或缩小范围）',
				contentCapHit: '文本文件对数超出内容比对上限，超出部分仅按大小判定',
				dirTruncated: '目录较大超出条目上限，结果不完整',
				backToDir: '返回目录对比',
				colLeft: '左 · 基准', colRight: '右 · 对比', dirSubDiff: '内部有差异（点击展开）', dirAllSame: '内部完全一致',
				officeMixed: '暂不支持 Office 与非 Office 文件对比（两侧需同为 Office/PDF）', officeSideBySide: '并排预览 · 只读',

identical: '无差异',
				chunksUnit: '处变更'
			});
		});
	</script>
</body>
</html>
