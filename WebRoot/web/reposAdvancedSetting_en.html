<div>
	<div class="panel-body eventset-list" id="reposSettingArea">
       	<li class="eventset-tit" style="margin-top: 0px;">
			<i class='cell  read w15'>Set As Public</i>
			<i class='cell  access w10'>Repository / Directory</i>
			<i class='cell  access w40'>Default Access Permission</i>
			<i class='cell op w10'>Operation</i>				
		</li>
		<li>
			<i class='cell  read w15'>
				<input id='gPublic' onchange='enableReposConfig();' type='checkbox'>Public</input>
			</i>
			<i class='cell  name w10'>
				<a href='javascript:void(0)' id='gName' >Repository Name</a>
			</i>
			<i class='cell  read w10'>
				<input id='gAccess' value='' type='checkbox' disabled='disabled'>Read</input>
			</i>
			<i class='cell edit w10'>
				<input id='gEditEn' value='' type='checkbox' disabled='disabled'>Write</input>
			</i>
			<i class='cell add w10'>
				<input id='gAddEn'  value='' type='checkbox' disabled='disabled'>Add</input>
			</i>
			<i class='cell delete w10'>
				<input id='gDeleteEn'  value='' type='checkbox' disabled='disabled'>Delete</input>
			</i>
			<i class='cell op w10'>
				<a href='javascript:void(0)' onclick="saveReposSetting();" class='mybtn-primary'>Save</a>
			</i>
		</li>
	</div>
</div>

<script type="text/javascript">
	function reposSettingPageInit()
	{
		getReposSetting();
	}
        
    //Page init code    
    $(function(){
		reposSettingPageInit();
	});

//Show the repository public access permission settings
function getReposSetting(){
   	console.log("getReposSetting()");
   	var docId = curRightClickedTreeNode.id;
	var docName = curRightClickedTreeNode.name;
   	var vid = getQueryString("vid");
	console.log("docId:" +docId + "docName:" +docName);

    $.ajax({
              url : "/DocSystem/Repos/getReposSetting.do",
              type : "post",
              dataType : "json",
              data : {
              	docId: docId,
                reposId : vid,
              },
              success : function (ret) {
                  if( "ok" == ret.status ){
                      showReposSetting(ret.data);
                  }
                  else
                  {
                  	showErrorMessage("Error:" + ret.msgInfo);
                  }
              },
              error : function () {
                 showErrorMessage('Server error: failed to get the repository public access permission!');
              }
    });


	//Draw the list from the fetched directory permission user list data
	function showReposSetting(data){
		console.log(data);
		var docId = curRightClickedTreeNode.id;
		var docName = curRightClickedTreeNode.name;
   		var vid = getQueryString("vid");
		console.log("docId:" +docId + "docName:" +docName);
		
		//Enable the global configuration button
		$("#gPublic").attr("disabled",false);		
		
		if(data == null){	//Parameters are empty
			//Get the repository name		
			$("#gPublic").attr("checked",false);
			$("#gName").text(docName);
			return;
		}
		
		$("#gName").text(docName);
		$("#gPublic").attr("checked",true);
		$("#gAccess").attr("disabled",false);
		$("#gEditEn").attr("disabled",false);
		$("#gAddEn").attr("disabled",false);
		$("#gDeleteEn").attr("disabled",false);
		if(data.access == 1) $("#gAccess").attr("checked",true);
		if(data.editEn == 1) $("#gEditEn").attr("checked",true);
		if(data.addEn == 1) $("#gAddEn").attr("checked",true);
		if(data.deleteEn == 1) $("#gDeleteEn").attr("checked",true);
	}
}

function enableReposConfig()
{
	//alert(index);
	//alert($("#User"+index).prop("checked"));
	if($("#gPublic").prop("checked") == true)
	{
		$("#gAccess").attr("disabled",false);
		$("#gEditEn").attr("disabled",false);
		$("#gAddEn").attr("disabled",false);
		$("#gDeleteEn").attr("disabled",false);
	}
	else
	{
		$("#gAccess").attr("disabled",true);
		$("#gEditEn").attr("disabled",true);
		$("#gAddEn").attr("disabled",true);
		$("#gDeleteEn").attr("disabled",true);
	}
}

function saveReposSetting()
{
	console.log("saveReposSetting");
	var docId = curRightClickedTreeNode.id;
	var vid = getQueryString("vid");
	var isPublic = $("#gPublic").prop("checked")? 1:0;
	var access = $("#gAccess").prop("checked")? 1:0;
	var editEn = $("#gEditEn").prop("checked")? 1:0;
	var addEn = $("#gAddEn").prop("checked")? 1:0;
	var deleteEn = $("#gDeleteEn").prop("checked")? 1:0;

	$.ajax({
              url : "/DocSystem/Repos/configReposSetting.do",
              type : "post",
              dataType : "json",
              data : {
              	docId: docId,
                reposId : vid,
                isPublic:isPublic,
                isAdmin: 0,
                access: access,
                editEn: editEn,
                addEn: addEn,
                deleteEn: deleteEn,
              },
              success : function (ret) {
                  if( "ok" == ret.status ){
	                   	// Normal message toast
						bootstrapQ.msg({
								msg : 'Configure Completed',
								type : 'success',
								time : 2000,
							    });                      
                  }
                  else
                  {
                  	showErrorMessage("Error:" + ret.msgInfo);
                  }
              },
              error : function () {
                 showErrorMessage('Server error: failed to get the repository public access permission!');
              }
    });
}

</script>
